<!-- HEADER -->

    <a href="index.html" class="saved-brand">
        VAYEN
    </a>

    <a href="account.html" class="saved-back">
        ← Account
    </a>

</header>



<main class="customer-saved">


    <!-- INTRO -->

    <section class="saved-hero">

        <span class="saved-label">
            SAVED · FOR LATER
        </span>

        <h1>
            Worth<br>
            <span>keeping.</span>
        </h1>

        <p>
            A quiet place for the things
            you want to come back to.
        </p>

    </section>



    <!-- SAVED TOOLBAR -->

    <section class="saved-toolbar">

        <div class="saved-count">

            <span id="savedCount">0</span>

            <small>SAVED</small>

        </div>

        <button type="button"
                class="saved-sort">
            Recently saved
        </button>

    </section>



    <!-- SAVED PRODUCTS -->

    <section class="saved-products"
             id="savedProducts">

        <!-- Saved products will appear here later -->

    </section>



    <!-- EMPTY STATE -->

    <section class="saved-empty"
             id="savedEmpty">

        <div class="saved-empty-mark">
            ♡
        </div>

        <span>YOUR SAVED SPACE</span>

        <h2>
            Keep the good<br>
            <em>ones close.</em>
        </h2>

        <p>
            Save anything that catches your eye.
            It'll stay here until you're ready
            to come back to it.
        </p>

        <a href="index.html"
           class="saved-explore-button">

            Explore VAYEN
            <span>→</span>

        </a>

    </section>


</main>
