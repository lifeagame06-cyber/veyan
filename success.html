<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Purchase Confirmation — VAYEN</title>
<style>
:root{font-family:Arial,Helvetica,sans-serif;color:#30232a;background:#f8f2ef}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 80% 10%,#f1dfe4,transparent 44%),#f8f2ef}a{text-decoration:none;color:inherit}.header{height:76px;padding:0 max(22px,calc((100vw - 1080px)/2));display:flex;align-items:center;justify-content:space-between;background:#fffaf8d9;border-bottom:1px solid #eadce0}.brand{font-weight:900;font-size:22px;letter-spacing:5px}.header a:last-child{font-size:13px;color:#806b75}.shell{min-height:calc(100vh - 155px);padding:50px 18px;display:grid;place-items:center}.card{width:min(100%,570px);padding:46px 38px;border-radius:27px;background:#fffaf8;border:1px solid #ecdee2;box-shadow:0 22px 70px #50313b12;text-align:center}.mark{width:80px;height:80px;border-radius:24px;background:#f2e3e7;color:#8f6375;margin:0 auto 24px;display:grid;place-items:center;font-size:35px}.mark.success{background:#dff5e9;color:#16845a;box-shadow:0 0 0 7px #edf9f2}.mark.warning{background:#fff0e4;color:#ac713d}.eyebrow{font-size:11px;letter-spacing:2.5px;font-weight:800;color:#9b687a}h1{font-size:clamp(29px,5vw,43px);letter-spacing:-1.5px;margin:14px 0}.desc{font-size:14px;color:#796b73;line-height:1.75;margin:0 auto 24px;max-width:410px}.order{display:none;background:#f7f1f0;border:1px solid #eadfe1;border-radius:15px;padding:18px;margin:20px 0;text-align:left}.order strong{display:block;margin-bottom:6px}.order small{font-size:12px;color:#84737a;overflow-wrap:anywhere}.primary{display:none;background:#30232a;color:#fff;border-radius:14px;padding:17px 20px;font-weight:750;font-size:14px;margin:24px 0 12px}.secondary{display:inline-block;font-size:13px;color:#735d69;margin-top:8px}.foot{text-align:center;border-top:1px solid #eadce0;padding:24px 12px;color:#917c84;font-size:11px}.links{display:flex;gap:10px;justify-content:center;margin-bottom:12px;flex-wrap:wrap}.links a:hover{text-decoration:underline}@media(max-width:700px){.header{height:66px;padding:0 20px}.brand{font-size:19px}.card{padding:40px 23px}}
</style>
</head>
<body>
<header class="header"><a class="brand" href="index.html">VAYEN</a><a href="collection.html">← Continue exploring</a></header>
<main class="shell"><section class="card" aria-live="polite"><div class="mark" id="mark">…</div><span class="eyebrow" id="eyebrow">VAYEN / PURCHASE STATUS</span><h1 id="heading">Checking your purchase</h1><p class="desc" id="message">Please wait while we securely confirm your order.</p><div class="order" id="order"><strong id="product"></strong><small id="reference"></small></div><a class="primary" id="view" href="library.html?tab=purchased">View Your Product →</a><a class="secondary" href="collection.html">Continue exploring</a></section></main>
<footer class="foot"><nav class="links"><a href="refund.html">Refund Policy</a><a href="contact.html">Contact Us</a><a href="privacy.html">Privacy Policy</a></nav>© 2026 VAYEN · Digital products, thoughtfully made.</footer>
<script src="vayen-firebase-config.js"></script>
<script type="module">
import {initializeApp,getApps,getApp} from 'https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js';
import {getAuth,onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js';
import {getFirestore,doc,getDoc} from 'https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js';
const $=id=>document.getElementById(id);
const orderId=new URLSearchParams(location.search).get('order')||'';
function status(title,message){$('heading').textContent=title;$('message').textContent=message;$('mark').textContent='!';$('mark').classList.add('warning')}
try{
 if(!/^order_[A-Za-z0-9]{6,80}$/.test(orderId)){status('Order reference required','Open your verified purchase from My Products to view its details.');}
 else{
  const config=window.VAYEN_FIREBASE_CONFIG || {apiKey:'AIzaSyCJStLo-FmvkPQo-u-cP-J4rQ8z4ecYMW4',authDomain:'veyan-53930.firebaseapp.com',projectId:'veyan-53930',appId:'1:836801786398:web:a73fbda60267efcdbd740f'};
  const app=getApps().length?getApp():initializeApp(config),auth=getAuth(app),db=getFirestore(app);
  const user=await new Promise((resolve,reject)=>{const unsub=onAuthStateChanged(auth,u=>{unsub();resolve(u)},reject)});
  if(!user){location.replace('login.html');}
  else{
   const snap=await getDoc(doc(db,'orders',orderId));
   const o=snap.exists()?snap.data():null;
   if(!o || o.userId!==user.uid){status('Order not available','We could not find this order in your account. Please open My Products or contact support.');}
   else if(o.paymentStatus==='paid' && o.verificationStatus==='verified'){
    $('mark').textContent='✓';$('mark').classList.add('success');
    $('eyebrow').textContent='VAYEN / PURCHASE CONFIRMED';
    $('heading').textContent='Thank You for Your Purchase!';
    $('message').textContent='Your payment is verified and your digital product is ready in My Products.';
    $('product').textContent=o.productName||'Your VAYEN product';
    $('reference').textContent='Order reference: '+orderId;
    $('order').style.display='block';
    $('view').style.display='block';
   }else{status('Payment confirmation pending','We are checking your order. If payment was completed, please check My Products shortly or contact support.');}
  }
 }
}catch(error){console.error('VAYEN purchase confirmation:',error);status('Unable to check your order','Please open My Products or contact support if your purchase is missing.');}
</script></body></html>
